<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>

    <style>
        .container {
            display : flex;
        }
        .box-container {
            display : flex;
            gap : 10px;

        }
        .container div {
            border : 2px solid rgb(21, 158, 53);
            height : 50px;
            width : 50px;
            font-size : 2em;
        }

        .box{
            border : 2px solid rgb(123, 48, 48);
            width : 150px;
            height : 50px;
            font-size : 2em;
        }
    </style>
</head>

<body>
    <div class ="container">
        <div> 1 </div>
        <div> 2 </div>
        <div> 3 </div>
        <div> 4 </div>
        <div> 5 </div>
        <div> 6 </div>
        <div> 7 </div>
        <div> 8 </div>
        <div> 9 </div>
    </div>

    <div class="box-container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
    </div>
</body>

</html>
