<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: white;
            width: 400px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 15px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #555;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 5px;
        }

        .success {
            color: green;
            font-weight: bold;
        }

        .warning {
            color: red;
            font-weight: bold;
        }

        .tips {
            color: #444;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Password Strength Checker</h1>

        <label for="password">Enter Password:</label>

        <input type="password" id="password" placeholder="Enter your password">

        <button onclick="checkStrength()">
            Check Strength
        </button>

        <div id="result">
            <p>Strength result will appear here.</p>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
